<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png?v=2" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png?v=2" />
    <meta name="theme-color" content="#0e3b43" />
    <title>Argus — Quant Pricing Platform</title>
    <script>
      // apply the saved theme before first paint (no flash)
      try {
        const t = localStorage.getItem("qplat-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        // ?design=eyes|metro|billets|paper|classic opens (and remembers) a design: shareable links
        const q = new URLSearchParams(location.search).get("design");
        if (q && /^(classic|eyes|metro|billets|paper)$/.test(q)) localStorage.setItem("argus-design", q);
        // language: ?lang=en|fr, then the saved choice, else English (keep in sync with DEFAULT_LANG in src/lib/i18n.tsx)
        const ql = new URLSearchParams(location.search).get("lang");
        if (ql === "en" || ql === "fr") localStorage.setItem("argus-lang", ql);
        document.documentElement.lang = localStorage.getItem("argus-lang") === "fr" ? "fr" : "en";
        // default design for a first visit: « Les cent yeux » (keep in sync with DEFAULT_DESIGN in src/lib/theme.tsx)
        document.documentElement.dataset.design = localStorage.getItem("argus-design") || "eyes";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
