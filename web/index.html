<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>Argus — Quant Pricing Platform</title>
    <script>
      // apply the saved theme before first paint (no flash)
      try {
        const t = localStorage.getItem("qplat-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        // ?design=eyes|metro|billets|paper|classic opens (and remembers) a design: shareable links
        const q = new URLSearchParams(location.search).get("design");
        if (q && /^(classic|eyes|metro|billets|paper)$/.test(q)) localStorage.setItem("argus-design", q);
        const d = localStorage.getItem("argus-design");
        if (d) document.documentElement.dataset.design = d;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
